<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drumless — Dashboard</title>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 222.2 84% 4.9%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 210 40% 98%;
      --secondary: 210 40% 96.1%;
      --secondary-foreground: 222.2 47.4% 11.2%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 221.2 83.2% 53.3%;
      --accent-foreground: 210 40% 98%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 210 40% 98%;
      --border: 214.3 31.8% 91.4%;
      --input: 214.3 31.8% 91.4%;
      --radius: 0.5rem;
    }

    .dark {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
      --popover: 222.2 84% 4.9%;
      --popover-foreground: 210 40% 98%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 222.2 47.4% 11.2%;
      --secondary: 217.2 32.6% 17.5%;
      --secondary-foreground: 210 40% 98%;
      --muted: 215 27.9% 16.9%;
      --muted-foreground: 215 16.2% 46.9%;
      --accent: 221.2 83.2% 53.3%;
      --accent-foreground: 210 40% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 210 40% 98%;
      --border: 215 27.9% 16.9%;
      --input: 215 27.9% 16.9%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }

    html {
      -webkit-text-size-adjust: 100%;
      tab-size: 4;
    }

    body {
      background: var(--background);
      color: var(--foreground);
      transition: background 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    #root {
      isolation: isolate;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-center: center;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s ease, background-color 0.2s ease;
      outline: none;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .btn-secondary:hover {
      opacity: 0.9;
    }

    .input {
      display: block;
      width: 100%;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--background);
      padding: 0.875rem;
      font-size: 0.875rem;
      color: var(--foreground);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .card {
      background: var(--card);
      color: var(--card-foreground);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .section {
      padding: 3rem 0;
    }

    .section-header {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .section-desc {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-bottom: 2rem;
      max-width: 24rem;
    }

    .grid {
      display: grid;
    }

    .grid-cols-1 {
      grid-template-columns: repeat(1, minmax(0, 1fr));
    }

    .md\:grid-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .max-w-2xl {
      max-width: 28rem;
    }

    .mx-auto {
      margin-left: auto;
      margin-right: auto;
    }

    .py-12 {
      padding-top: 3rem;
      padding-bottom: 3rem;
    }

    .mb-8 {
      margin-bottom: 2rem;
    }

    .mt-8 {
      margin-top: 2rem;
    }

    .mt-6 {
      margin-top: 1.5rem;
    }

    .pt-8 {
      padding-top: 2rem;
    }

    .border-t {
      border-top-style: solid;
    }

    .text-3xl {
      font-size: 1.875rem;
    }

    .font-medium {
      font-weight: 500;
    }

    .font-bold {
      font-weight: 700;
    }

    .text-muted-foreground {
      color: var(--muted-foreground);
    }

    .text-5xl {
      font-size: 3rem;
    }

    .input {
      width: 100%;
    }

    .w-full {
      width: 100%;
    }

    .h-2 {
      height: 0.5rem;
    }

    .py-2 {
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .text-sm {
      font-size: 0.875rem;
    }

    .text-primary {
      color: var(--primary);
    }

    .bg-primary {
      background: var(--primary);
    }

    .bg-secondary {
      background: var(--secondary);
    }

    .bg-gray-50 {
      background-color: #f9fafb;
    }

    .bg-gray-900 {
      background-color: #1e293b;
    }

    .dark\:bg-gray-200 {
      background-color: #e5e7eb;
    }

    .dark\:bg-gray-900 {
      background-color: #1e293b;
    }

    .dark\:rounded-h {
      border-radius: 0 0 0.75rem 0.75rem;
    }

    .cursor-pointer {
      cursor: pointer;
    }

    .absolute {
      position: absolute;
    }

    .bottom-0 {
      bottom: 0;
    }

    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .space-x-2 > * + * {
      margin-left: 0.5rem;
    }

    .py-1 {
      padding-top: 0.25rem;
      padding-bottom: 0.25rem;
    }

    .py-6 {
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
    }

    .mb-2 {
      margin-bottom: 0.5rem;
    }

    .mb-1 {
      margin-bottom: 0.25rem;
    }

    .transition {
      transition-property: color, background-color, border-color;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 150ms;
    }

    .focus-visible\:outline-none &:focus-visible {
      outline: none;
    }

    .focus-visible\:ring-2 &:focus-visible {
      ring-width: 2px;
      ring-color: var(--primary);
    }

    .focus-visible\:ring-offset-2 &:focus-visible {
      ring-offset: 2px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-background font-body">

  <header class="header">
    <div>
      <h1 class="text-4xl font-bold tracking-tight">Drumless</h1>
      <p class="text-muted-foreground">Drum‑removal + practice tempo tool</p>
    </div>
    <div class="flex items-center gap-3">
      <button id="theme-toggle" class="btn btn-secondary" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="section">
    <div class="max-w-2xl mx-auto">
      <!-- Status card -->
      <div id="status-card" class="card mb-8 hidden">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-8 h-8 rounded bg-primary/10 flex items-center justify-center">
            <svg class="w-4 h-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4l2 8h4l2 -8h-4l-2 8h-2l-2 -8H9l2 -8H5z"/>
            </svg>
          </div>
          <div>
            <p id="status-text" class="font-medium">Ready</p>
            <p id="stage-text" class="text-xs text-muted-foreground">Upload a track to get started</p>
          </div>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-h full" aria-label="Progress bar">
          <div id="progress-bar" class="h-2 rounded-lg bg-primary transition-width" style="width: 0%"></div>
        </div>
      </div>

      <!-- Results card -->
      <div id="results-card" class="card grid grid-cols-1 gap-6 md:grid-cols-2 hidden">
        <div>
          <h2 class="font-medium mb-3">Detected BPM</h2>
          <p id="bpm-value" class="text-5xl font-bold">120</p>
          <p id="bpm-info" class="text-muted-foreground">(source: auto, env: 120)</p>
        </div>
        <div>
          <h2 class="font-medium mb-3">Tempo Source</h2>
          <p id="tempo-source" class="text-muted-foreground">Auto-detected</p>
        </div>
      </div>

      <!-- Audio players -->
      <div class="grid gap-6 md:grid-cols-2 mt-8">
        <div>
          <h3 class="font-medium mb-3">Backing + Click</h3>
          <div class="relative">
            <audio id="mixed-player" controls preload="metadata" class="w-full"></audio>
            <button id="download-mixed" download class="abs-bottom btn btn-secondary text-sm">Download MP3</button>
          </div>
        </div>
        <div>
          <h3 class="font-medium mb-3">Backing Only</h3>
          <div class="relative">
            <audio id="backing-player" controls preload="metadata" class="w-full"></audio>
            <button id="download-backing" download class="abs-bottom btn btn-secondary text-sm">Download MP3</button>
          </div>
        </div>
      </div>

      <!-- BPM controls -->
      <div class="mt-8 pt-8 border-t">
        <h2 class="font-medium mb-3">Adjust BPM</h2>
        <div class="grid gap-3 mb-4">
          <button id="half-btn" class="btn btn-secondary">÷2</button>
          <button id="dbl-btn" class="btn btn-secondary">×2</button>
        </div>
        <div>
          <label class="text-sm font-medium">BPM: <span id="editable-bpm" class="font-mono">120</span></label>
          <input id="bpm-input" type="number" min="40" max="300" value="120" class="input w-full mt-2" />
        </div>
      </div>

      <!-- Click volume -->
      <div class="mt-6">
        <h2 class="font-medium mb-3">Click Volume</h2>
        <input id="click-gain" type="range" min="-20" max="0" value="0" class="input w-full mt-2" />
        <p id="click-gain-value" class="text-sm text-muted-foreground mt-1">0 dB</p>
      </div>

      <!-- Download buttons -->
      <div class="mt-8 pt-8 border-t">
        <button id="download-mixed-wav" download class="btn btn-primary w-full mb-2">Download Mixed (WAV)</button>
        <button id="download-backing-wav" download class="btn btn-secondary w-full">Download Backing (WAV)</button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const html = document.documentElement;
      const themeToggle = document.getElementById('theme-toggle');

      // Check for saved theme or preferred scheme
      const saved = localStorage.getItem('drumless-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (saved === 'dark' || (!saved && prefersDark)) {
        html.classList.add('dark');
        themeToggle.textContent = '☀️';
      }

      themeToggle.addEventListener('click', () => {
        html.classList.toggle('dark');
        const isDark = html.classList.contains('dark');
        localStorage.setItem('drumless-theme', isDark ? 'dark' : 'light');
        themeToggle.textContent = isDark ? '☀️' : '🌙';
      });
    })();
  </script>

</body>
</html>
