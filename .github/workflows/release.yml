name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Package frontend build
        run: tar -czf drumless-frontend-${{ github.ref_name }}.tar.gz -C frontend dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: drumless-frontend-${{ github.ref_name }}.tar.gz
          body: |
            ### What's Changed
            Auto-generated release from main branch.

            ### Highlights
            - Drum separation via Demucs AI model
            - Auto BPM detection from drum stem
            - Click track locked to first beat
            - YouTube URL or local audio file input
            - WAV & MP3 download options
            - Backing (no drums) + Mixed (backing + click) tracks
            - BPM halve/double adjustment
            - Click volume control (-20 dB to +6 dB)

            ### Build Information
            - **Frontend:** Built with Vite + React + TypeScript
            - **Backend:** FastAPI + Python pipeline (Demucs + librosa)
            - **Mobile:** Android (Kotlin / Jetpack Compose)

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          draft: false
          prerelease: false